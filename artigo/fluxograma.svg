<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 740" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 13px;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#202124" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1a73e8" />
    </marker>
  </defs>

  <!-- Fundo Branco -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- 1. Inicio -->
  <rect x="55" y="16" width="250" height="42" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2" />
  <text x="180" y="34" text-anchor="middle" font-weight="bold" font-size="13.5px" fill="#174ea6">Início: Admissão (t = 0)</text>
  <text x="180" y="50" text-anchor="middle" font-size="12px" fill="#1a73e8">Lote fechado e criação dos PCBs</text>

  <!-- Seta 1 -> 2 -->
  <line x1="180" y1="58" x2="180" y2="80" stroke="#202124" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- 2. Relogio Global -->
  <rect x="55" y="80" width="250" height="40" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2" />
  <text x="180" y="98" text-anchor="middle" font-weight="bold" font-size="13.5px" fill="#174ea6">Passo Lockstep</text>
  <text x="180" y="113" text-anchor="middle" font-size="12px" fill="#1a73e8">Avanço do relógio (tickGlobal++)</text>

  <!-- Seta 2 -> 3 -->
  <line x1="180" y1="120" x2="180" y2="142" stroke="#202124" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- 3. Loop dos Cores -->
  <rect x="55" y="142" width="250" height="38" rx="6" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.8" />
  <text x="180" y="166" text-anchor="middle" font-weight="bold" font-size="13px" fill="#202124">Itera núcleos (k = 0 ... n-1)</text>

  <!-- Seta 3 -> 4 (Decisao Stall) -->
  <line x1="180" y1="180" x2="180" y2="202" stroke="#202124" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- 4. Decisao Stall -->
  <polygon points="180,202 265,228 180,254 95,228" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.8" />
  <text x="180" y="232" text-anchor="middle" font-weight="bold" font-size="12.5px" fill="#202124">Núcleo em Stall?</text>

  <!-- Ramo Stall: Sim -->
  <line x1="265" y1="228" x2="305" y2="228" stroke="#202124" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="282" y="220" font-size="12px" font-weight="bold" fill="#d93025">Sim</text>
  <rect x="305" y="209" width="95" height="38" rx="5" fill="#fce8e6" stroke="#d93025" stroke-width="1.5" />
  <text x="352" y="225" text-anchor="middle" font-weight="bold" font-size="12px" fill="#c5221f">Consome stall</text>
  <text x="352" y="240" text-anchor="middle" font-size="11px" fill="#5f6368">ciclosStall--</text>

  <!-- Ramo Stall: Nao -->
  <line x1="180" y1="254" x2="180" y2="276" stroke="#202124" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="188" y="268" font-size="12px" font-weight="bold" fill="#188038">Não</text>

  <!-- 5. Decisao Livre -->
  <polygon points="180,276 265,302 180,328 95,302" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.8" />
  <text x="180" y="306" text-anchor="middle" font-weight="bold" font-size="12.5px" fill="#202124">Núcleo Livre?</text>

  <!-- Ramo Livre: Sim -->
  <line x1="265" y1="302" x2="305" y2="302" stroke="#202124" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="282" y="294" font-size="12px" font-weight="bold" fill="#188038">Sim</text>
  <rect x="305" y="283" width="95" height="38" rx="5" fill="#e6f4ea" stroke="#137333" stroke-width="1.5" />
  <text x="352" y="299" text-anchor="middle" font-weight="bold" font-size="12px" fill="#137333">Despachante</text>
  <text x="352" y="314" text-anchor="middle" font-size="11px" fill="#5f6368">restauraContexto</text>

  <!-- Retorno do Despachante para o Step -->
  <line x1="352" y1="321" x2="352" y2="370" stroke="#202124" stroke-width="1.5" />
  <line x1="352" y1="370" x2="305" y2="370" stroke="#202124" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Ramo Livre: Nao -> Executa Step -->
  <line x1="180" y1="328" x2="180" y2="350" stroke="#202124" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="188" y="342" font-size="12px" font-weight="bold" fill="#5f6368">Não</text>

  <!-- 6. Executa CPU step -->
  <rect x="55" y="350" width="250" height="40" rx="8" fill="#e8eaed" stroke="#3c4043" stroke-width="2" />
  <text x="180" y="368" text-anchor="middle" font-weight="bold" font-size="13.5px" fill="#202124">CPU::step() no Núcleo k</text>
  <text x="180" y="383" text-anchor="middle" font-size="11.5px" fill="#3c4043">Busca, decodifica e executa</text>

  <!-- Seta 6 -> 7 (Decisao HALT) -->
  <line x1="180" y1="390" x2="180" y2="412" stroke="#202124" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- 7. Decisao HALT -->
  <polygon points="180,412 265,438 180,464 95,438" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.8" />
  <text x="180" y="442" text-anchor="middle" font-weight="bold" font-size="12.5px" fill="#202124">Instrução HALT?</text>

  <!-- Ramo HALT: Sim -->
  <line x1="265" y1="438" x2="305" y2="438" stroke="#202124" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="282" y="430" font-size="12px" font-weight="bold" fill="#188038">Sim</text>
  <rect x="305" y="419" width="95" height="38" rx="5" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.5" />
  <text x="352" y="435" text-anchor="middle" font-weight="bold" font-size="12px" fill="#202124">FINALIZADO</text>
  <text x="352" y="450" text-anchor="middle" font-size="11px" fill="#5f6368">libera núcleo</text>

  <!-- Ramo HALT: Nao -->
  <line x1="180" y1="464" x2="180" y2="486" stroke="#202124" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="188" y="478" font-size="12px" font-weight="bold" fill="#5f6368">Não</text>

  <!-- 8. Decisao Quantum -->
  <polygon points="180,486 265,512 180,538 95,512" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.8" />
  <text x="180" y="516" text-anchor="middle" font-weight="bold" font-size="12px" fill="#202124">Fim do Quantum?</text>

  <!-- Ramo Quantum: Sim -->
  <line x1="265" y1="512" x2="305" y2="512" stroke="#202124" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="282" y="504" font-size="12px" font-weight="bold" fill="#d93025">Sim</text>
  <rect x="305" y="493" width="95" height="38" rx="5" fill="#fef7e0" stroke="#f29900" stroke-width="1.5" />
  <text x="352" y="509" text-anchor="middle" font-weight="bold" font-size="11.5px" fill="#b06000">Preempção</text>
  <text x="352" y="524" text-anchor="middle" font-size="11px" fill="#5f6368">salvarContexto</text>

  <!-- Conexões de retorno das caixas da direita (Stall, Halt, Quantum) para próximo core -->
  <line x1="400" y1="228" x2="406" y2="228" stroke="#5f6368" stroke-width="1.3" />
  <line x1="400" y1="438" x2="406" y2="438" stroke="#5f6368" stroke-width="1.3" />
  <line x1="400" y1="512" x2="406" y2="512" stroke="#5f6368" stroke-width="1.3" />
  <line x1="406" y1="228" x2="406" y2="576" stroke="#5f6368" stroke-width="1.3" />
  <line x1="406" y1="576" x2="265" y2="576" stroke="#5f6368" stroke-width="1.3" marker-end="url(#arrow)" />

  <!-- Ramo Quantum: Nao -->
  <line x1="180" y1="538" x2="180" y2="556" stroke="#202124" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="188" y="550" font-size="12px" font-weight="bold" fill="#5f6368">Não</text>

  <!-- 9. Decisao Fim do Lote -->
  <polygon points="180,556 265,582 180,608 95,582" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.8" />
  <text x="180" y="586" text-anchor="middle" font-weight="bold" font-size="12px" fill="#202124">Lote Concluído?</text>

  <!-- Lote Não Concluído -> Volta para Lockstep -->
  <line x1="95" y1="582" x2="20" y2="582" stroke="#1a73e8" stroke-width="1.8" />
  <text x="58" y="574" font-size="12px" font-weight="bold" fill="#d93025">Não</text>
  <line x1="20" y1="582" x2="20" y2="100" stroke="#1a73e8" stroke-width="1.8" />
  <line x1="20" y1="100" x2="55" y2="100" stroke="#1a73e8" stroke-width="1.8" marker-end="url(#arrow-blue)" />

  <!-- Lote Concluído -> Fim -->
  <line x1="180" y1="608" x2="180" y2="636" stroke="#202124" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="188" y="626" font-size="12px" font-weight="bold" fill="#188038">Sim</text>

  <!-- 10. Fim -->
  <rect x="55" y="636" width="250" height="42" rx="8" fill="#ceead6" stroke="#137333" stroke-width="2" />
  <text x="180" y="654" text-anchor="middle" font-weight="bold" font-size="13.5px" fill="#0d652d">Término da Simulação</text>
  <text x="180" y="670" text-anchor="middle" font-size="11.5px" fill="#137333">Gera telemetria e encerra</text>
</svg>
